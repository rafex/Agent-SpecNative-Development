[project]
name = "specnative-agent-pilot"
version = "0.1.0"
description = "Interactive SpecNative definition agent pilot"
requires-python = ">=3.11"
dependencies = [
  "smolagents[mcp,openai]>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
specnative-agent = "specnative_pilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "specnative-agent-pilot"
version = "0.2.0"
description = "Interactive SpecNative definition agent pilot"
requires-python = ">=3.11"
dependencies = [
  "smolagents[mcp,openai]>=1.26,<2",
  "mcp>=1.10,<2",
  "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asn = "specnative_pilot.cli:asn_main"
asn-mcp = "specnative_pilot.mcp_launcher:main"
asn-agent-mcp = "specnative_pilot.agent_mcp_server:main"
specnative-agent = "specnative_pilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specnative_pilot = ["resources/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

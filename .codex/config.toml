# Project-scoped SpecNative MCP configuration for Codex.
# `asn-mcp` is installed on PATH, so this works on macOS and Linux.

[mcp_servers.specnative]
command = "asn-mcp"
args = ["--repo", "."]
cwd = "."
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120

[mcp_servers.specnative.tools.resume]
approval_mode = "approve"
